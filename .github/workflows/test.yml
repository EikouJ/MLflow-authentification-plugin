name: Tests MLflow Auth Plugin

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]
        mlflow-version: ["2.0.0", "2.5.0", "latest"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install MLflow ${{ matrix.mlflow-version }}
      run: |
        python -m pip install --upgrade pip
        if [ "${{ matrix.mlflow-version }}" = "latest" ]; then
          pip install mlflow
        else
          pip install mlflow==${{ matrix.mlflow-version }}
        fi
    
    - name: Install plugin dependencies
      run: |
        cd mlflow-auth-plugin
        pip install -e .
    
    - name: Run plugin tests
      run: |
        cd mlflow-auth-plugin
        python -m pytest tests/ -v --tb=short
    
    - name: Test integration
      run: |
        cd deployment
        python setup_environment.py
        source venv/bin/activate
        
        # Démarrer MLflow en arrière-plan
        python start_mlflow.py --port 5555 &
        MLFLOW_PID=$!
        
        # Attendre le démarrage
        sleep 15
        
        # Tester l'accès
        curl -f http://localhost:5555/auth/login || exit 1
        
        # Arrêter MLflow
        kill $MLFLOW_PID
